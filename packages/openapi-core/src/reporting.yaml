openapi: 3.1.0
info:
  title: Guardloop Reporting API
  version: 0.1.0
  description: |
    Audit and board exports across Identify–Assess–Control–Monitor periods (BR-10).
  license:
    name: Proprietary
    url: https://guardloop.local/license
  x-domain: rpt
servers:
  - url: https://api.guardloop.local
    description: Guardloop API
security:
  - bearerAuth: []
  - apiKey: []

tags:
  - name: Reporting
    description: Audit and board export reports
paths:
  /v1/reporting/exports:
    get:
      operationId: listAuditExports
      tags: [Reporting]
      summary: List audit exports
      security:
        - bearerAuth: []
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
        - name: status
          in: query
          schema:
            type: string
            enum: [queued, running, done, failed]
      responses:
        '200':
          description: Exports page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditExportListResponse'
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: createAuditExport
      tags: [Reporting]
      summary: Create an audit export job
      security:
        - bearerAuth: []
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditExportCreateRequest'
      responses:
        '201':
          description: Export queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditExportResponse'
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/reporting/exports/{reportId}:
    get:
      operationId: getAuditExport
      tags: [Reporting]
      summary: Get audit export
      security:
        - bearerAuth: []
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            $ref: ./common/primitives.yaml#/components/schemas/ReportId
      responses:
        '200':
          description: Export
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditExportResponse'
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
    bearerAuth:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerAuth

  schemas:
    AuditExportStatus:
      type: string
      enum: [queued, running, done, failed]
    AuditExport:
      type: object
      required:
        - reportId
        - periodStart
        - periodEnd
        - useCaseIds
        - status
        - createdAt
      properties:
        reportId:
          $ref: ./common/primitives.yaml#/components/schemas/ReportId
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
        useCaseIds:
          type: array
          items:
            $ref: ./common/primitives.yaml#/components/schemas/UseCaseId
        status:
          $ref: '#/components/schemas/AuditExportStatus'
        downloadUrl:
          type: string
          format: uri
        summary:
          type: string
        createdAt:
          type: string
          format: date-time
    AuditExportCreateRequest:
      type: object
      required: [periodStart, periodEnd]
      properties:
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
        useCaseIds:
          type: array
          items:
            $ref: ./common/primitives.yaml#/components/schemas/UseCaseId
    AuditExportResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AuditExport'
        meta:
          $ref: ./common/envelopes.yaml#/components/schemas/ResponseMeta
    AuditExportListData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditExport'
        nextCursor:
          type: string
    AuditExportListResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AuditExportListData'
        meta:
          $ref: ./common/envelopes.yaml#/components/schemas/ResponseMeta
