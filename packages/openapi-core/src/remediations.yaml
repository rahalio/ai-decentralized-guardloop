openapi: 3.1.0
info:
  title: Guardloop Remediations API
  version: 0.1.0
  description: |
    Owned remediation programmes for monitor findings, including board-reportable cases (BR-9, BR-10).
  license:
    name: Proprietary
    url: https://guardloop.local/license
  x-domain: rmd
servers:
  - url: https://api.guardloop.local
    description: Guardloop API
security:
  - bearerAuth: []
  - apiKey: []

tags:
  - name: Remediations
    description: Remediation cases
paths:
  /v1/remediations:
    get:
      operationId: listRemediations
      tags: [Remediations]
      summary: List remediation cases
      security:
        - bearerAuth: []
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
        - name: useCaseId
          in: query
          schema:
            $ref: ./common/primitives.yaml#/components/schemas/UseCaseId
        - name: status
          in: query
          schema:
            type: string
            enum: [open, in_progress, closed]
        - name: boardReportable
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Remediations page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemediationCaseListResponse'
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: openRemediation
      tags: [Remediations]
      summary: Open a remediation case
      security:
        - bearerAuth: []
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemediationCaseCreateRequest'
      responses:
        '201':
          description: Remediation opened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemediationCaseResponse'
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/remediations/{remediationId}:
    parameters:
      - name: remediationId
        in: path
        required: true
        schema:
          $ref: ./common/primitives.yaml#/components/schemas/RemediationId
    get:
      operationId: getRemediation
      tags: [Remediations]
      summary: Get remediation case
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Remediation case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemediationCaseResponse'
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    patch:
      operationId: updateRemediation
      tags: [Remediations]
      summary: Update remediation case
      security:
        - bearerAuth: []
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemediationCaseUpdateRequest'
      responses:
        '200':
          description: Updated remediation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemediationCaseResponse'
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
    bearerAuth:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerAuth

  schemas:
    RemediationStatus:
      type: string
      enum: [open, in_progress, closed]
    RemediationCase:
      type: object
      required:
        - remediationId
        - useCaseId
        - owner
        - status
        - boardReportable
        - createdAt
        - updatedAt
      properties:
        remediationId:
          $ref: ./common/primitives.yaml#/components/schemas/RemediationId
        useCaseId:
          $ref: ./common/primitives.yaml#/components/schemas/UseCaseId
        owner:
          type: string
          minLength: 1
        status:
          $ref: '#/components/schemas/RemediationStatus'
        boardReportable:
          type: boolean
        alertId:
          $ref: ./common/primitives.yaml#/components/schemas/AlertId
        dueAt:
          type: string
          format: date-time
        summary:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RemediationCaseCreateRequest:
      type: object
      required: [useCaseId, owner]
      properties:
        useCaseId:
          $ref: ./common/primitives.yaml#/components/schemas/UseCaseId
        owner:
          type: string
          minLength: 1
        boardReportable:
          type: boolean
          default: false
        alertId:
          $ref: ./common/primitives.yaml#/components/schemas/AlertId
        dueAt:
          type: string
          format: date-time
        summary:
          type: string
    RemediationCaseUpdateRequest:
      type: object
      properties:
        owner:
          type: string
          minLength: 1
        status:
          $ref: '#/components/schemas/RemediationStatus'
        boardReportable:
          type: boolean
        dueAt:
          type: string
          format: date-time
        summary:
          type: string
    RemediationCaseResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/RemediationCase'
        meta:
          $ref: ./common/envelopes.yaml#/components/schemas/ResponseMeta
    RemediationCaseListData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RemediationCase'
        nextCursor:
          type: string
    RemediationCaseListResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/RemediationCaseListData'
        meta:
          $ref: ./common/envelopes.yaml#/components/schemas/ResponseMeta
