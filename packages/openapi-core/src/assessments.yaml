openapi: 3.1.0
info:
  title: Guardloop Assessments API
  version: 0.1.0
  description: |
    Risk identification and assessment for AI use cases — technical and conduct findings required (BR-4, BR-5).
  license:
    name: Proprietary
    url: https://guardloop.local/license
  x-domain: asm
servers:
  - url: https://api.guardloop.local
    description: Guardloop API
security:
  - bearerAuth: []
  - apiKey: []

tags:
  - name: Assessments
    description: Risk identification and assessment
paths:
  /v1/use-cases/{useCaseId}/identifications:
    parameters:
      - name: useCaseId
        in: path
        required: true
        schema:
          $ref: ./common/primitives.yaml#/components/schemas/UseCaseId
    get:
      operationId: listRiskIdentifications
      tags: [Assessments]
      summary: List risk identifications for a use case
      security:
        - bearerAuth: []
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
        - name: status
          in: query
          schema:
            type: string
            enum: [open, closed]
      responses:
        '200':
          description: Identifications page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskIdentificationListResponse'
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: createRiskIdentification
      tags: [Assessments]
      summary: Create a risk identification
      security:
        - bearerAuth: []
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskIdentificationCreateRequest'
      responses:
        '201':
          description: Identification created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskIdentificationResponse'
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/use-cases/{useCaseId}/identifications/{identificationId}:
    get:
      operationId: getRiskIdentification
      tags: [Assessments]
      summary: Get risk identification
      security:
        - bearerAuth: []
      parameters:
        - name: useCaseId
          in: path
          required: true
          schema:
            $ref: ./common/primitives.yaml#/components/schemas/UseCaseId
        - name: identificationId
          in: path
          required: true
          schema:
            $ref: ./common/primitives.yaml#/components/schemas/IdentificationId
      responses:
        '200':
          description: Identification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskIdentificationResponse'
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/use-cases/{useCaseId}/assessments:
    parameters:
      - name: useCaseId
        in: path
        required: true
        schema:
          $ref: ./common/primitives.yaml#/components/schemas/UseCaseId
    get:
      operationId: listRiskAssessments
      tags: [Assessments]
      summary: List risk assessments for a use case
      security:
        - bearerAuth: []
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, complete]
      responses:
        '200':
          description: Assessments page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskAssessmentListResponse'
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: createRiskAssessment
      tags: [Assessments]
      summary: Create a risk assessment
      description: Requires both technicalFindings and conductFindings — accuracy alone is insufficient (BR-5).
      security:
        - bearerAuth: []
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskAssessmentCreateRequest'
      responses:
        '201':
          description: Assessment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskAssessmentResponse'
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/use-cases/{useCaseId}/assessments/{assessmentId}:
    get:
      operationId: getRiskAssessment
      tags: [Assessments]
      summary: Get risk assessment
      security:
        - bearerAuth: []
      parameters:
        - name: useCaseId
          in: path
          required: true
          schema:
            $ref: ./common/primitives.yaml#/components/schemas/UseCaseId
        - name: assessmentId
          in: path
          required: true
          schema:
            $ref: ./common/primitives.yaml#/components/schemas/AssessmentId
      responses:
        '200':
          description: Assessment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskAssessmentResponse'
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
    bearerAuth:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerAuth

  schemas:
    IdentificationScope:
      type: string
      enum: [use_case, org_wide]
    IdentificationStatus:
      type: string
      enum: [open, closed]
    ResidualRisk:
      type: string
      enum: [low, medium, high, critical]
    AssessmentStatus:
      type: string
      enum: [draft, complete]
    RiskIdentification:
      type: object
      required:
        - identificationId
        - useCaseId
        - scope
        - triggers
        - findings
        - status
        - createdAt
        - updatedAt
      properties:
        identificationId:
          $ref: ./common/primitives.yaml#/components/schemas/IdentificationId
        useCaseId:
          $ref: ./common/primitives.yaml#/components/schemas/UseCaseId
        scope:
          $ref: '#/components/schemas/IdentificationScope'
        triggers:
          type: array
          items:
            type: string
        findings:
          type: array
          items:
            type: string
        owner:
          type: string
        status:
          $ref: '#/components/schemas/IdentificationStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RiskIdentificationCreateRequest:
      type: object
      required: [scope, triggers, findings]
      properties:
        scope:
          $ref: '#/components/schemas/IdentificationScope'
        triggers:
          type: array
          minItems: 1
          items:
            type: string
        findings:
          type: array
          minItems: 1
          items:
            type: string
        owner:
          type: string
    RiskAssessment:
      type: object
      required:
        - assessmentId
        - useCaseId
        - technicalFindings
        - conductFindings
        - residualRisk
        - status
        - createdAt
        - updatedAt
      properties:
        assessmentId:
          $ref: ./common/primitives.yaml#/components/schemas/AssessmentId
        useCaseId:
          $ref: ./common/primitives.yaml#/components/schemas/UseCaseId
        identificationId:
          $ref: ./common/primitives.yaml#/components/schemas/IdentificationId
        technicalFindings:
          type: array
          items:
            type: string
        conductFindings:
          type: array
          items:
            type: string
        residualRisk:
          $ref: '#/components/schemas/ResidualRisk'
        status:
          $ref: '#/components/schemas/AssessmentStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RiskAssessmentCreateRequest:
      type: object
      required: [technicalFindings, conductFindings, residualRisk]
      description: BR-5 — both technical and conduct findings are mandatory (not accuracy alone).
      properties:
        identificationId:
          $ref: ./common/primitives.yaml#/components/schemas/IdentificationId
        technicalFindings:
          type: array
          minItems: 1
          items:
            type: string
        conductFindings:
          type: array
          minItems: 1
          items:
            type: string
        residualRisk:
          $ref: '#/components/schemas/ResidualRisk'
        status:
          $ref: '#/components/schemas/AssessmentStatus'
    RiskIdentificationResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/RiskIdentification'
        meta:
          $ref: ./common/envelopes.yaml#/components/schemas/ResponseMeta
    RiskIdentificationListData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RiskIdentification'
        nextCursor:
          type: string
    RiskIdentificationListResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/RiskIdentificationListData'
        meta:
          $ref: ./common/envelopes.yaml#/components/schemas/ResponseMeta
    RiskAssessmentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/RiskAssessment'
        meta:
          $ref: ./common/envelopes.yaml#/components/schemas/ResponseMeta
    RiskAssessmentListData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RiskAssessment'
        nextCursor:
          type: string
    RiskAssessmentListResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/RiskAssessmentListData'
        meta:
          $ref: ./common/envelopes.yaml#/components/schemas/ResponseMeta
